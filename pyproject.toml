[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sspo-bench"
version = "1.0.0"
description = "SSPO-Bench: An Agentic Benchmark for RL Algorithm Discovery under Test-Time Code Selection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
    "torch>=2.2.0",
]

[tool.setuptools.packages.find]
include = ["sspo*", "benchmark*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
