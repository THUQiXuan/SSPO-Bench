# Pilot configuration: default hyperparameters
experiment_name: "sspo_pilot"
mode: "pilot"

data:
  source: "code_contests"
  train_file: "data/train.jsonl"
  dev_file: "data/dev.jsonl"
  test_file: "data/test.jsonl"
  max_train_problems: 3000
  dev_size: 100
  max_eval_problems: 100
  diag_pool_size: 100

checker:
  version: "v1"
  cache_dir: "cache"
  timeout_seconds: 1.5
  memory_limit_gb: 2
  n_generators: 4
  n_bruteforce: 4
  n_validators: 2
  min_ref_agree: 2
  enable_thinking: false

rollout:
  turns: 1
  temperature: 1.0
  top_p: 1.0
  max_tokens: 1536
  max_context_length: 4096

train:
  arm: "sspo"
  n_rollouts: 16
  k_deploy: 8
  alpha: 0.7
  center_select: "none"
  batch_problems: 16
  total_steps: 30
  checker_reward_steps: 20
  save_every: 5
  lr: 1.0e-6
  kl_coef: 0.001
  clip_eps: 0.2
  weight_decay: 0.01
  max_grad_norm: 1.0
  resume: true
  backend: "native"

eval:
  n_eval: 16
  k_list: [1, 2, 4, 8, 16]
  select_k_list: [1, 2, 4, 8, 16]
  n_subsets: 200
  subset_seed: 42
  bootstrap_samples: 2000
